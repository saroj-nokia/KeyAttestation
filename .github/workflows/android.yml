name: Build

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Secrets are not exposed to PRs from forks, so release is built only when they exist.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_FILE != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # versionCode is the git commit count
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build debug
        run: ./gradlew assembleDebug
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build release
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease
        env:
          STORE_FILE: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
