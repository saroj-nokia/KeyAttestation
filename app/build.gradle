import com.android.build.api.instrumentation.*
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.Remapper

plugins {
    id 'com.android.application'
}

def gitCommitCount
try {
    gitCommitCount = providers.exec {
        commandLine("git", "rev-list", "--count", "HEAD")
    }.standardOutput.asText.get().toInteger()
} catch (ignored) {
    gitCommitCount = 1
}

def properties = new Properties()
def local = project.rootProject.file("local.properties")
if (local.exists()) {
    properties.load(local.newDataInputStream())
}

def localesFile = file("locales.txt")
def supportedLocales = localesFile.readLines().findAll { it && !it.startsWith("#") }

// Release signing comes from env vars (CI) or local.properties. Without a complete set,
// the release build falls back to the debug key so assembleRelease still works locally.
def releaseStoreFile = System.getenv("STORE_FILE") ?: properties.getProperty("storeFile")
def releaseStorePassword = System.getenv("STORE_PASSWORD") ?: properties.getProperty("storePassword")
def releaseKeyAlias = System.getenv("KEY_ALIAS") ?: properties.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("KEY_PASSWORD") ?: properties.getProperty("keyPassword")
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword
if (!hasReleaseSigning) {
    logger.warn("Release signing not configured; release APK will be signed with the debug key.")
}

android {
    compileSdk = 37
    namespace = 'io.github.vvb2060.keyattestation'
    defaultConfig {
        minSdk = 24
        targetSdk = 35
        versionCode = gitCommitCount
        versionName = '2.1.0'
        optimization {
            keepRules {
                ignoreFromAllExternalDependencies = true
            }
        }
    }

    signingConfigs {
        debug {
            if (properties.getProperty("storeFile") != null) {
                storeFile = file(properties.getProperty("storeFile"))
                storePassword = properties.getProperty("storePassword")
                keyAlias = properties.getProperty("keyAlias")
                keyPassword = properties.getProperty("keyPassword")
            }
        }
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            vcsInfo.include = false
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_27
        targetCompatibility = JavaVersion.VERSION_27
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        aidl = true
    }

    packaging {
        resources {
            excludes += '**'
        }
    }

    androidResources {
        generateLocaleConfig = true
        localeFilters += supportedLocales
    }

    installation {
        installOptions += ["--user 0"]
    }

    lint.checkReleaseBuilds = false
    dependenciesInfo.includeInApk = false
}

kotlin {
    compilerOptions {
        progressiveMode.set(true) // only valid on the latest language version, so don't pin languageVersion
    }
}

// Show which Java call sites use deprecated APIs (the default build prints only a one-line note).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

// Matched by name (not the internal AGP task class) so AGP upgrades can't break the script.
tasks.matching { it.name.startsWith("compile") && it.name.endsWith("ArtProfile") }.configureEach {
    enabled = false
}

configurations.configureEach {
    exclude group: 'dev.rikka.rikkax.appcompat', module: 'appcompat'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    compileOnly project(':stub')

    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'com.google.guava:guava:33.8.0-android'
    implementation 'co.nstant.in:cbor:0.9'

    //noinspection GradleDependency
    implementation 'dev.rikka.rikkax.material:material:1.6.6'
    implementation 'dev.rikka.rikkax.html:html-ktx:1.1.2'
    implementation 'dev.rikka.rikkax.recyclerview:recyclerview-adapter:1.3.0'
    implementation 'dev.rikka.rikkax.widget:borderview:1.1.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'com.google.android.material:material:1.14.0'
}

androidComponents {
    onVariants(selector().all(), {
        instrumentation.transformClassesWith(ClassVisitorFactory.class,
                InstrumentationScope.PROJECT) {}
    })
}

abstract class ClassVisitorFactory implements AsmClassVisitorFactory<InstrumentationParameters.None> {
    ClassVisitor createClassVisitor(ClassContext classContext, ClassVisitor classVisitor) {
        return new ClassRemapper(classVisitor, new Remapper() {
            String map(String name) {
                var index = name.indexOf('$')
                if (index != -1) {
                    return map(name.substring(0, index)) + name.substring(index)
                }
                if (name.endsWith("_rename")) {
                    return name.substring(0, name.length() - 7)
                }
                return name
            }
        })
    }

    boolean isInstrumentable(ClassData classData) {
        return classData.className.startsWith("io.github.vvb2060.keyattestation.keystore.")
    }
}
